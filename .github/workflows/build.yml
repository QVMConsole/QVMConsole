name: 构建 Linux 发行包

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (例如: 1.0.0 或 v1.0.0)'
        required: true
        type: string
      build_platforms:
        description: '选择构建平台'
        required: true
        type: choice
        default: 'amd64,arm64'
        options:
          - amd64,arm64
          - amd64
          - arm64
      variant:
        description: '构建变体（留空时构建兼容版和原生版）'
        required: false
        type: string
        default: ''
      create_release:
        description: '同时创建或更新 GitHub Release（产物始终上传到文件中继）'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# 中继采用固定路径，避免不同发布同时写入同一个文件。
concurrency:
  group: qvmconsole-linux-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: 准备发布参数
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.config.outputs.version }}
      tag: ${{ steps.config.outputs.tag }}
      platforms: ${{ steps.config.outputs.platforms }}
    steps:
      - name: 解析版本与构建平台
        id: config
        shell: bash
        env:
          RAW_VERSION: ${{ github.event.release.tag_name || inputs.version }}
          BUILD_PLATFORMS: ${{ inputs.build_platforms || 'amd64,arm64' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9][0-9A-Za-z._+-]*$ ]]; then
            echo '::error::版本号必须以数字开头，只能包含字母、数字、点、下划线、加号和连字符，可带 v 前缀。'
            exit 1
          fi
          if [[ "$EVENT_NAME" == 'release' ]]; then
            tag="$RAW_VERSION"
          else
            tag="v$version"
          fi
          case "$BUILD_PLATFORMS" in
            amd64,arm64) platforms='["amd64","arm64"]' ;;
            amd64) platforms='["amd64"]' ;;
            arm64) platforms='["arm64"]' ;;
            *) echo '::error::不支持的构建平台。'; exit 1 ;;
          esac
          printf 'version=%s\ntag=%s\nplatforms=%s\n' "$version" "$tag" "$platforms" >> "$GITHUB_OUTPUT"

  build:
    name: 构建 Linux ${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      # Release 事件的 github.sha 指向其标签提交，确保构建该版本源码。
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 设置 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: 安装 zig
        env:
          ZIG_ARCH: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}
        run: |
          set -euo pipefail
          curl -fsSL "https://ziglang.org/download/0.14.0/zig-linux-${ZIG_ARCH}-0.14.0.tar.xz" | sudo tar xJ -C /usr/local
          sudo ln -sf "/usr/local/zig-linux-${ZIG_ARCH}-0.14.0/zig" /usr/local/bin/zig
          zig version

      - name: 执行构建脚本 (build.sh)
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          if [ -n "$BUILD_VARIANT" ]; then
            bash build.sh -v "$BUILD_VERSION" --variant "$BUILD_VARIANT"
          else
            bash build.sh -v "$BUILD_VERSION"
          fi

      - name: 保存构建产物
        uses: actions/upload-artifact@v5
        with:
          name: kvm-console-linux-${{ matrix.arch }}
          path: release/kvm-console-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # 两个上传任务独立执行，中继失败不会阻止 GitHub Release 附件上传。
  release:
    name: 上传到 GitHub Release
    needs: [prepare, build]
    if: github.event_name == 'release' || inputs.create_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载所有已构建平台的产物
        uses: actions/download-artifact@v5
        with:
          pattern: kvm-console-linux-*
          path: release-artifacts
          merge-multiple: true

      - name: 上传到已发布的 Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: release-artifacts/*.tar.gz
          fail_on_unmatched_files: true

      - name: 手动创建或更新 Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.tag }}
          files: release-artifacts/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true

  relay:
    name: 上传 Linux ${{ matrix.arch }} 到文件中继
    needs: [prepare, build]
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    uses: yxsj245/Download_Station_CICD/.github/workflows/relay-upload.yml@v1
    with:
      artifact-name: kvm-console-linux-${{ matrix.arch }}
      file: kvm-console-linux-${{ matrix.arch }}.tar.gz
      logical-path: 开源项目/QVMConsole/Open/kvm-console-linux-${{ matrix.arch }}.tar.gz
      relay-base: ${{ vars.RELAY_BASE }}
      poll-timeout: '0'
    secrets:
      RELAY_ADMIN_KEY: ${{ secrets.RELAY_ADMIN_KEY }}
      RELAY_UPLOAD_KEY: ${{ secrets.RELAY_UPLOAD_KEY }}
